[project]
name = "copilot"
version = "0.1.0"
description = "Support-ticket co-pilot for a retail forex/CFD broker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.11",
    "httpx>=0.28",
    "lingua-language-detector>=2.2.0",
]

[project.optional-dependencies]
laya = ["laya>=0.4.13"]
anthropic = ["anthropic>=0.70"]

[project.scripts]
copilot = "copilot.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--strict-markers -q"
testpaths = ["tests"]
pythonpath = ["."]  # the evals package

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "SIM", "RET", "PT", "S", "BLE", "PERF",
    "RUF", "C90", "D", "ERA", "TRY", "PTH", "PLE", "PLW",
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",  # size of a function, not magic numbers
]
ignore = [
    "E501",    # long patterns and prompt strings
    "RUF001",  # Cyrillic and other scripts are intended
    "SIM905",  # word lists read best as one string
    "TRY003",  # one-line error messages are the clearest
    "D102",    # methods implement documented protocols
    "D105",    # magic methods
    "D107",    # __init__ is documented on the class
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]
"src/copilot/llm.py" = ["S603", "S607"]  # the claude CLI is invoked with an argument list

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "evals"]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["laya", "laya.*", "anthropic", "anthropic.*"]
ignore_missing_imports = true
