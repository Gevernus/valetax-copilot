name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash  # -eo pipefail: a failing command in a pipe fails the step
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4  # renders the agent page's script in test_view.py
        with:
          node-version: "22"
      - name: Install (with the anthropic extra, so its tests run)
        run: uv sync --locked --extra anthropic
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests (a skipped test fails the build)
        run: |
          uv run pytest -rs | tee pytest.log
          ! grep -q SKIPPED pytest.log
      - name: Eval gate (saved runs through the current code)
        run: uv run python -m evals.gate 2026-10-23 2026-10-23-challenge
