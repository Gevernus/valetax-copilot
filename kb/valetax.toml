# --- How to open an account -----------------------------------------------

[[section]]
id = "open.steps"
sources = ["open"]
title = "How to open an account"
text = """
Open your account with us in 3 quick and simple steps. Step 1: Visit www.valetax.com and click on \
'Create Account' at the top right of the page. Step 2: Enter your details in the required fields \
and proceed to create your account. Step 3: Upon successful registration, you will be provided \
access to your own Member Area. Step 4: Once completed, you're ready to make your first deposit."""

[[section]]
id = "open.sign-up"
sources = ["open"]
title = "How do I sign up for an account?"
text = """
Follow the step-by-step instructions to verify and fund your account to start trading. Opening a \
live account allows you to begin trading immediately. We recommend clients to read through our Risk \
Disclosures, Privacy Policy and Terms of Business before they start trading."""
issues = ["I5"]

[[section]]
id = "open.account-type"
sources = ["open"]
title = "What account type should I open?"
text = """
It will depend on your trading strategy and preferred trading instruments. You may view the various \
account types on the Account types page. You may open another account type that suits you better \
at a later stage too."""
issues = ["I4"]

[[section]]
id = "open.min-initial-deposit"
sources = ["open"]
title = "What is the minimum initial deposit needed to open an account?"
text = """
It will depend on the account type that is being selected. You may view details of all our accounts \
on the Account types page and the minimum deposit that is required for each account type."""
issues = ["I4"]

[[section]]
id = "open.documents"
sources = ["open"]
title = "Do I need to provide any documents to open an account?"
text = """
For live accounts, we will require a Proof of identification and Proof of address via a bank \
statement or a utility bill that are not older than 6 months. Please ensure that your name is \
clearly displayed in these documents."""

[[section]]
id = "open.time"
sources = ["open"]
title = "How long does it take to open an account?"
text = "Account opening and document verification will be completed within 48 hours."
issues = ["I5"]

[[section]]
id = "open.leverage"
sources = ["open"]
title = "What leverage settings should I select?"
text = """
Your leverage setting is dependent on your trading strategy and goals. At Valetax, we offer up to \
1:2000 depending on account types. For more details, visit our Account types page."""

[[section]]
id = "open.islamic"
sources = ["open"]
title = "Do you offer an Islamic-friendly account?"
text = """
All our account are Islamic friendly and there is no swap is credited or withdrawn from all trading \
account."""

# --- How to verify --------------------------------------------------------

[[section]]
id = "verify.steps"
sources = ["verify"]
title = "How to verify your account"
text = """
Identity verification plays a crucial role in ensuring the utmost security and protection against \
identity theft and fraud. Step 1: Complete the required fields and upload the required documents to \
complete your KYC profile. Step 2: Once completed, you will be taken to this page while your account \
is being reviewed. Step 3: Account verification completed! You're all set to trade."""
issues = ["I3"]
