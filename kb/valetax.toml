# Valetax help-centre knowledge base, phase 1.
#
# Source: the four public pages below, snapshot of 2026-10-22, text kept verbatim
# (typos included) so a citation can be checked against the live page.
# The FAQ block that appears identically on the deposit and withdrawal pages is
# stored once, with both URLs in `sources`.
#
# `issues` names entries in docs/kb-issues.md. A section with an issue of kind
# "conflict" sends any draft that cites it to a human (see routing.py); one of kind
# "defect" is known to be wrong and is kept out of the drafter's prompt.

snapshot = "2026-10-22"

[pages]
deposit = "https://valetax.com/how-to-deposit/"
withdraw = "https://valetax.com/how-to-withdraw/"
open = "https://valetax.com/how-to-open-an-account/"
verify = "https://valetax.com/how-to-verify-account/"

[issues]
I1 = "conflict"   # deposit credit time: "instant" vs "within 60 minutes"
I2 = "defect"     # withdrawal steps are the deposit steps
I3 = "gap"        # verification page has no document list or timeline
I4 = "gap"        # minimum deposit depends on account type; account-types page not in KB
I5 = "conflict"   # "begin trading immediately" (twice) vs "verification within 48 hours"
I6 = "gap"        # no fees, methods, limits or withdrawal processing time anywhere
I7 = "conflict"   # "instant" withdrawals vs "pending, in queue" and "24 hours"

# --- How to deposit -------------------------------------------------------

[[section]]
id = "deposit.steps"
sources = ["deposit"]
title = "How to deposit"
text = """
Valetax offers a range of instant, simple and secure funding methods catering to your requirements \
and preferences. Step 1: Log in to your Member Area. Step 2: Select your preferred payment channel. \
Click on the Deposit button and select your preferred payment channel. Step 3: Enter your account \
details and amount to deposit. Step 4: Start Trading!"""

# --- Funding FAQ (identical on the deposit and withdrawal pages) ----------

[[section]]
id = "funding.min-deposit"
sources = ["deposit", "withdraw"]
title = "What is the minimum deposit amount?"
text = "The minimum deposit starts from 8 USD, depending on the account type."
issues = ["I4"]

[[section]]
id = "funding.how-to-deposit"
sources = ["deposit", "withdraw"]
title = "How can I deposit funds into my account?"
text = "You may log in to your member area and select the preferred payment option and deposit size."

[[section]]
id = "funding.currencies"
sources = ["deposit", "withdraw"]
title = "What currencies can I use to deposit funds?"
text = """
You may deposit using any preferred currency into our USD account, which will follow that day's \
exchange rates."""

[[section]]
id = "funding.credit-time"
sources = ["deposit", "withdraw"]
title = "How long does it take for deposited funds to be credited to my balance?"
text = "Deposits are instant! You will be able to view your updated account balance within 60 minutes."
issues = ["I1"]

[[section]]
id = "funding.available-for-trading"
sources = ["deposit", "withdraw"]
title = "When will my funds be available for trading?"
text = "You can begin trading immediately once your balance has been updated."
issues = ["I5"]

[[section]]
id = "funding.history"
sources = ["deposit", "withdraw"]
title = "Where can I view my deposit and withdrawal history?"
text = """
You may log in to your member area to view all transactions related to deposits, withdrawals and \
transfers."""

[[section]]
id = "funding.withdrawal-pending"
sources = ["deposit", "withdraw"]
title = "What is my withdrawal request status 'pending'?"
text = """
This means your request in in queue and in the midst of getting processed. Once approved, you will \
be notified."""

[[section]]
id = "funding.withdrawal-rejected"
sources = ["deposit", "withdraw"]
title = "Why was my withdrawal request rejected?"
text = """
It could be that your account has not been verified, a possible error to data entered or \
insifficient margin to process withdrawals. We will notify you via email on the rejection reason to \
help fix this issue."""

[[section]]
id = "funding.withdrawal-not-received"
sources = ["deposit", "withdraw"]
title = "I have not received my funds after my withdrawal request. What should I do?"
text = """
Should you not receive your funds within 24 hours, please reach out to our friendly support team \
for assistance."""

